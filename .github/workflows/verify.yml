name: Verify

on:
  push:
    branches:
      - '**'   # all branches
    tags:
      - 'v*'
    

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -al

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check format
        run: npm run format

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    # if: github.event.base_ref == 'refs/heads/2-add-workflow-for-tesing-building-and-publishing-package'
    steps:

      - name: Print variables
        run: echo ${{ github.ref }} ${{ github.event_name }} ${{ github.event.base_ref }}
      - name: List files
        run: ls -al
