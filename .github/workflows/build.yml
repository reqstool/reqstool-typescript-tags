name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      version:
        description: "Stamp package.json with this version before building. Empty = leave as-is."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/typescript-lint.yml@ci/385-shared-python-build # SPIKE: pin to release SHA

  build:
    needs: lint
    uses: reqstool/.github/.github/workflows/typescript-build.yml@ci/385-shared-python-build # SPIKE: pin to release SHA
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}
      # e2e runs the compiled dist/index.js, so it follows the build; the
      # self-applied tags land in build/reqstool/ next to the junit output.
      post-test-command: |
        npm run test:e2e
        npm run reqstool:self-apply

  reqstool:
    needs: build
    uses: reqstool/.github/.github/workflows/common-reqstool-verify.yml@ci/385-shared-python-build # SPIKE: pin to release SHA
    with:
      build-artifact: ${{ inputs.artifact-name || 'dist' }}-build

  smoke:
    needs: build
    uses: reqstool/.github/.github/workflows/typescript-smoke.yml@ci/385-shared-python-build # SPIKE: pin to release SHA
    with:
      # Unit and e2e tests on Windows/macOS: path separators, line endings and
      # encoding only show against fixture files on those platforms.
      command: |
        npm run build
        npm test
        npm run test:e2e

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1

  # Single stable required check: survives job renames and matrix changes.
  ci:
    if: ${{ always() }}
    needs: [lint, build, reqstool, smoke, validate-openspec]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'
