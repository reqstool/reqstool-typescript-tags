name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      version:
        description: "Stamp package.json with this version before building. Empty = leave as-is."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/typescript-lint.yml@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1
  build:
    needs:
      - lint
    uses: reqstool/.github/.github/workflows/typescript-build.yml@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}

  reqstool:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        reqstool-source: [pypi, main]
    steps:
      # Full history and tags: the release flow derives the version from git state, so a
      # shallow clone would build the wrong number rather than fail.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
      - run: npm ci
      - run: npm run build
      - name: Run unit tests (writes build/test-results/junit-unit.xml)
        run: npm test
      - name: Run e2e tests (writes build/test-results/junit-e2e.xml)
        run: npm run test:e2e
      - name: Self-apply own tags processor to own src/tests
        run: npm run reqstool:self-apply
      - name: Install reqstool
        uses: reqstool/.github/.github/actions/install-reqstool@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1
        with:
          reqstool-source: ${{ matrix.reqstool-source }}
      - name: Validate reqstool spec completeness
        # not yet available in the latest PyPI release; supplementary to (not a
        # replacement for) the `reqstool status --fail-if-incomplete` gate below, which
        # is the actual required check on the pypi leg
        if: matrix.reqstool-source == 'main'
        uses: reqstool/.github/.github/actions/validate-reqstool@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1
      - name: Run reqstool status
        # Required gate on both matrix legs -- fails the build unless every
        # requirement is implemented and verified.
        uses: reqstool/.github/.github/actions/reqstool-status@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1
        with:
          fail-if-incomplete: "true"

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1
