name: Publish

on:
  release:
    types: [created]

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  check-release:
    uses: ./.github/workflows/check_release.yml

  publish:
    runs-on: ubuntu-latest
    needs:
      - verify
      - check-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # - name: Publish
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
