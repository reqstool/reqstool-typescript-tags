name: Publish

on:
  release:
    types: [created]

jobs:
  check-release:
    uses: ./.github/workflows/check_release.yml
  build:
    uses: ./.github/workflows/build.yml
  publish:
    needs:
      - check-release
      - build
    uses: reqstool/.github/.github/workflows/typescript-publish-to-npm.yml@ec64e2df249d8a923d56688e61409b51ea0ca1e0 # main 2026-05-19
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
