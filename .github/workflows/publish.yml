name: Publish

on:
  release:
    types: [created]

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check branch
        shell: bash
        run: |
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "Tag must start with 'v'"
            exit 1
          fi
          if [ "${{ github.event.release.target_commitish }}" != "main" ]; then
            echo "Release must be on main branch!"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # - name: Publish
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
