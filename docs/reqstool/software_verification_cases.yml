# yaml-language-server: $schema=https://raw.githubusercontent.com/reqstool/reqstool-client/main/src/reqstool/resources/schemas/v1/software_verification_cases.schema.json

cases:
  - id: SVC_TAGS_001
    requirement_ids: ["TAGS_001"]
    title: "Verify the AST walker collects @Requirements/@SVCs-tagged functions, classes, methods, and test cases with their fully qualified name and element kind"
    verification: automated-test
    revision: "0.1.0"

  - id: SVC_TAGS_002
    requirement_ids: ["TAGS_002"]
    title: "Verify scanned tag occurrences are grouped by ID into implementations/tests, each recording element kind and fully qualified name"
    verification: automated-test
    revision: "0.1.0"

  - id: SVC_TAGS_003
    requirement_ids: ["TAGS_003"]
    title: "Verify the exported YAML matches the expected schema-tagged implementations/tests structure"
    verification: automated-test
    revision: "0.1.0"

  - id: SVC_TAGS_004
    requirement_ids: ["TAGS_004"]
    title: "Verify the assembled -reqstool package contains the dataset, annotations.yml, test results, and a generated reqstool_config.yml/package.json"
    verification: automated-test
    revision: "0.1.0"
